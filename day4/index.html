<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Toolkit</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="notebook-page">

    <header class="note-header">
      <p id="today-date"></p>
      <h1>Notes Toolkit</h1>
      <p class="subtitle">Write it down. Don't forget it.</p>
    </header>

    <section class="note-area">
      <label for="note-text">Today's thoughts</label>

      <textarea
        id="note-text"
        placeholder="Start writing..."
      ></textarea>
    </section>

    <div class="actions">
      <button id="clear-btn">Clear note</button>
    </div>

    <footer class="note-footer">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>

      <button
        id="theme-toggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
      >
        ◐
      </button>
    </footer>

  </main>
</body>
</html>
